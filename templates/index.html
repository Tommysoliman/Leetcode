<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Atlas | Practice Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="masthead"><div><p class="kicker">PRACTICE LAB / 300 CHALLENGES</p><h1>Code Atlas</h1></div><p class="tagline">Build fluency, one precise answer at a time.</p></header>
  <main>
    <section class="control-bar" aria-label="Quiz controls">
      <div class="tabs" role="tablist"><button class="tab active" data-section="python">Python</button><button class="tab" data-section="sql">SQL</button><button class="tab" data-section="vba">VBA</button></div>
      <label>Level <select id="difficulty"><option value="all">All levels</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
      <label class="search-wrap">Filter <input id="search" type="search" placeholder="Find a topic..." autocomplete="off"></label>
    </section>
    <nav class="view-tabs" aria-label="View mode"><button class="view-tab active" data-view="practice">Practice</button><button class="view-tab" data-view="answer">Answer</button><button class="view-tab" data-view="ask">Ask AI</button></nav>
    <section class="workspace">
      <aside class="progress-panel"><div class="section-label">YOUR PROGRESS</div><div id="progress"></div><div class="legend"><span class="dot done"></span> answered correctly <span class="dot"></span> remaining</div></aside>
      <section class="quiz-panel"><div class="quiz-meta"><span id="counter">Question 1</span><span id="level" class="badge">Easy</span></div><h2 id="title"></h2><p id="prompt"></p><div id="examples" class="examples"></div><div id="practice-view"><textarea id="answer" rows="9" placeholder="Write your solution here..." spellcheck="false"></textarea><div class="actions"><button id="submit" class="primary">Run Code <span>Ctrl + Enter</span></button><button id="hint" class="secondary">Show hint</button><button id="next" class="secondary" hidden>Next question</button></div><div id="feedback" role="status" aria-live="polite"></div></div><div id="answer-view" class="hidden"><div id="revealed-answer" class="revealed-answer"></div></div><div id="ask-view" class="hidden"><p class="ai-note">Ask for a hint, a deeper explanation, or a related example.</p><textarea id="ai-question" rows="4" placeholder="What would you like to understand?"></textarea><button id="ask-submit" class="primary">Ask AI</button><div id="ai-feedback" role="status" aria-live="polite"></div></div></section>
      <aside class="queue-panel"><div class="section-label">QUESTION QUEUE</div><div id="queue"></div></aside>
    </section>
  </main>
  <script>
    let section = 'python', questions = [], current = 0, answered = new Set(), view = 'practice';
    const $ = id => document.getElementById(id);
    async function load() { const level = $('difficulty').value; const response = await fetch(`/api/questions?section=${section}&difficulty=${level}`); questions = await response.json(); current = 0; answered.clear(); render(); }
    function render() { const term = $('search').value.toLowerCase(); const visible = questions.filter(q => `${q.title} ${q.prompt}`.toLowerCase().includes(term)); if (!visible.length) { $('title').textContent = 'No matching questions'; $('prompt').textContent = 'Try another filter.'; $('answer').disabled = true; $('submit').disabled = true; $('queue').innerHTML = ''; return; } $('answer').disabled = false; $('submit').disabled = false; const q = visible[Math.min(current, visible.length - 1)]; $('counter').textContent = `Question ${q.number} / 100`; $('level').textContent = q.difficulty; $('level').className = `badge ${q.difficulty}`; $('title').textContent = q.title; $('prompt').textContent = q.prompt; $('examples').innerHTML = q.examples.map(example => `<div><strong>Input</strong><code>${escapeHtml(example.input)}</code><strong>Output</strong><code>${escapeHtml(example.output)}</code></div>`).join(''); $('answer').value = q.starter_code || ''; $('feedback').className = ''; $('feedback').textContent = ''; $('next').hidden = true; $('revealed-answer').innerHTML = '<p>Click the Answer tab to reveal the solution and explanation.</p>'; $('ai-feedback').textContent = ''; $('hint').dataset.hints = JSON.stringify(q.hints); $('hint').dataset.level = '0'; $('queue').innerHTML = visible.map((item, i) => `<button class="queue-item ${i === current ? 'selected' : ''} ${answered.has(item.id) ? 'answered' : ''}" data-index="${i}"><span>${String(item.number).padStart(3, '0')}</span>${item.title}</button>`).join(''); document.querySelectorAll('.queue-item').forEach(button => button.onclick = () => { current = Number(button.dataset.index); render(); }); setView(view); updateProgress(); }
    async function reveal() { const visible = questions.filter(q => `${q.title} ${q.prompt}`.toLowerCase().includes($('search').value.toLowerCase())); const q = visible[current]; const result = await (await fetch(`/api/answer/${q.id}`)).json(); $('revealed-answer').innerHTML = `<pre>${escapeHtml(result.answer)}</pre><p>${escapeHtml(result.explanation)}</p>`; }
    function setView(nextView) { view = nextView; document.querySelectorAll('.view-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.view === view)); $('practice-view').classList.toggle('hidden', view !== 'practice'); $('answer-view').classList.toggle('hidden', view !== 'answer'); $('ask-view').classList.toggle('hidden', view !== 'ask'); if (view === 'answer') reveal(); }
    async function updateProgress() { const data = await (await fetch('/api/progress')).json(); $('progress').innerHTML = data.map(item => `<div class="progress-row"><span>${item.section.toUpperCase()}</span><strong>${item.correct} <small>/ 100</small></strong><div class="meter"><i style="width:${item.correct}%"></i></div></div>`).join(''); }
    $('submit').onclick = async () => { const visible = questions.filter(q => `${q.title} ${q.prompt}`.toLowerCase().includes($('search').value.toLowerCase())); const q = visible[current]; const result = await (await fetch(`/api/run/${q.id}`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({code: $('answer').value}) })).json(); $('feedback').className = result.status === 'passed' ? 'correct' : 'incorrect'; if (result.tests) { $('feedback').innerHTML = `${result.status === 'passed' ? 'Correct!' : 'Not quite yet.'} <p>${result.passed_count} / ${result.test_count} visible tests passed.</p>${result.tests.map(test => `<div>${test.passed ? 'PASS' : 'FAIL'} Test ${test.index}${test.passed ? '' : `: returned ${escapeHtml(test.actual || test.error || '')}`}</div>`).join('')}`; } else { $('feedback').textContent = result.message || result.error; } if (result.status === 'passed') { answered.add(q.id); $('next').hidden = false; } updateProgress(); };
    $('hint').onclick = () => { const hints = JSON.parse($('hint').dataset.hints || '[]'); const level = Number($('hint').dataset.level || 0); $('hint').dataset.level = String(Math.min(level + 1, hints.length)); $('feedback').innerHTML = `<strong>Hint ${Math.min(level + 1, hints.length)}:</strong> ${escapeHtml(hints[level] || 'You have seen all available hints.')}`; };
    $('next').onclick = () => { current = (current + 1) % questions.length; render(); $('answer').focus(); };
    document.querySelectorAll('.view-tab').forEach(tab => tab.onclick = () => setView(tab.dataset.view));
    $('ask-submit').onclick = async () => { const question = $('ai-question').value.trim(); if (!question) return; $('ai-feedback').textContent = 'Thinking...'; const visible = questions.filter(q => `${q.title} ${q.prompt}`.toLowerCase().includes($('search').value.toLowerCase())); const q = visible[current]; const response = await fetch('/api/ask-ai', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question, context:`${q.title}: ${q.prompt}`})}); const result = await response.json(); $('ai-feedback').innerHTML = result.error ? `<p class="incorrect">${escapeHtml(result.error)}</p>` : `<p>${escapeHtml(result.answer)}</p>`; };
    $('difficulty').onchange = load; $('search').oninput = () => { current = 0; render(); }; document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => { document.querySelector('.tab.active').classList.remove('active'); tab.classList.add('active'); section = tab.dataset.section; load(); }); $('answer').onkeydown = event => { if (event.ctrlKey && event.key === 'Enter') $('submit').click(); }; function escapeHtml(value) { return value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char])); } load();
  </script>
</body>
</html>
